name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Production Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Authenticate Cloudflare
        env:
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
          STATIC_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_REFRESH_TOKEN" ]; then
            echo "Requesting fresh Cloudflare access token..."
            RESPONSE=$(curl -s -X POST https://dash.cloudflare.com/oauth2/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=refresh_token&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7&refresh_token=$CLOUDFLARE_REFRESH_TOKEN")
            ACCESS_TOKEN=$(node -e "try { const d = JSON.parse(process.argv[1]); console.log(d.access_token || ''); } catch {}" "$RESPONSE")
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "::add-mask::$ACCESS_TOKEN"
              echo "CLOUDFLARE_API_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
              echo "Authenticated successfully with fresh Cloudflare token."
            else
              echo "Could not refresh token; falling back to static CLOUDFLARE_API_TOKEN."
              echo "::add-mask::$STATIC_API_TOKEN"
              echo "CLOUDFLARE_API_TOKEN=$STATIC_API_TOKEN" >> $GITHUB_ENV
            fi
          else
            echo "Using static CLOUDFLARE_API_TOKEN."
            echo "::add-mask::$STATIC_API_TOKEN"
            echo "CLOUDFLARE_API_TOKEN=$STATIC_API_TOKEN" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloudflare Production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
